# Nginx cho Cây Câu Hỏi (web tĩnh sau khi build).
# Thay caycauhoi.example.com bằng tên miền thật trước khi dùng.
# Đặt vào /etc/nginx/sites-available/caycauhoi rồi tạo symlink sang sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name caycauhoi.example.com;

    root /var/www/caycauhoi;
    index index.html;

    # Nén JS / CSS / JSON (file .glb đã được nén meshopt sẵn).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # JS / CSS có mã hash trong tên file → cache 1 năm, không lo dùng nhầm bản cũ.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Model cây 3D.
    location /models/ {
        types { model/gltf-binary glb; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Câu hỏi & quà: luôn kiểm tra bản mới để sửa câu hỏi là người chơi thấy ngay.
    location /data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
