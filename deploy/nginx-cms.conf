# Bổ sung cho Nginx của Cây Câu Hỏi: trang quản trị /admin/ và API /cms-api/.
# Đặt vào /etc/nginx/snippets/caycauhoi-cms.conf rồi thêm dòng
#   include snippets/caycauhoi-cms.conf;
# vào khối server HTTPS (listen 443) của caycauhoi trong /etc/nginx/sites-available/caycauhoi.

# API quản trị → máy chủ CMS chỉ nghe ở 127.0.0.1:4310.
location /cms-api/ {
    proxy_pass http://127.0.0.1:4310;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_read_timeout 30s;
}

# Trang quản trị: không cache, không cho công cụ tìm kiếm lập chỉ mục.
location /admin/ {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
    add_header X-Frame-Options "DENY";
    try_files $uri $uri/ /admin/index.html;
}
